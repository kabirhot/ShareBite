<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - ShareBite</title>
    <meta name="description" content="Create a ShareBite account as a food donor, food receiver or volunteer.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/app.css">
</head>
<style>
    * {
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background-color: #FFF8E7;
    margin: 0;
    padding: 30px 15px;
    color: #333333;
}

section {
    width: 100%;
    max-width: 500px;
    margin: 100px auto;
    padding: 35px;
    background-color: #FFFFFF;
    border-radius: 15px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
}

h1 {
    text-align: center;
    color: #2E7D32;
    font-size: 32px;
    margin-bottom: 10px;
}

section > p {
    text-align: center;
    color: #666666;
    font-size: 15px;
    margin-bottom: 30px;
}

form {
    margin-top: 20px;
}

label {
    display: block;
    text-align: left;
    margin-bottom: 7px;
    font-weight: bold;
    color: #444444;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #81C784;
    border-radius: 7px;
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #2E7D32;
    box-shadow: 0 0 5px rgba(46, 125, 50, 0.25);
}

.forget {
    text-align: right;
    margin: 12px 0;
}

.forget a,
.signin a {
    color: #2E7D32;
    text-decoration: none;
    font-weight: bold;
}

.forget a:hover,
.signin a:hover {
    color: #1B5E20;
    text-decoration: underline;
}

button {
    width: 100%;
    padding: 13px;
    background-color: #2E7D32;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background-color: #1B5E20;
}

.signin {
    text-align: center;
    margin-top: 20px;
    color: #666666;
}
</style>
<body>
    <section>
        <h1><a href="index.html" style="color:inherit;text-decoration:none">SHARE BITE</a> SIGN IN</h1>
        <p>Distributing of excess food to reduce waste</p>

        <form id="signinForm">
            <label for="name"> Full Name: </label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>
 
            <br><br>

            <label for="email"> Email-id:</label>
            <input type="email" id="email" name="email" placeholder="Enter your Email-id" required>

            <br><br>

            <label for="phone"> Phone Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your Phone Number" maxlength="10" pattern="[0-9]{10}" required>

            <br><br>

            <button type="button" id="sendOtpBtn">Send OTP</button>

            <br><br>

            <label for="otp">OTP: </label>
            <input type="text" id="otp" name="otp" placeholder="Enter 6-digit OTP" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="one-time-code" required>

            <br><br>

            <button type="button" id="verifyOtpBtn">Verify OTP</button>

            <br><br>

            <label for="password"> Create Password:</label>
            <input type="password" id="password" name="password" placeholder="At least 8 characters" minlength="8" maxlength="72" autocomplete="new-password" required>
            <br><br>
            <label for="service"> Service: </label>

            <select id="service" name="service" required>
                <option value=""> Select </option>
                <option value="fooddonor"> Food Donor </option>
                <option value="foodreceiver"> Food Receiver </option>
                <option value="volunteers"> Volunteers </option>
            </select>

                        <p id="msg" class="form-msg" role="status" aria-live="polite"></p>
            <button type="submit">SUBMIT</button>
            <p class="signin"><a href="login.html">Already registered? Login!</a></p>
            <p class="legal-links">By continuing you agree to the <a href="terms.html">Terms of Use</a> and <a href="privacy.html">Privacy Policy</a>.</p>
        </form>
    </section>
    <script src="js/api.js"></script>
    <script src="js/signin.js"></script>
</body>
</html>
