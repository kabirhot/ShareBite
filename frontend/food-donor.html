<!DOCTYPE html> 
<html lang="en"> 
 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Donate Food - ShareBite</title>
    <meta name="description" content="Donate surplus food through ShareBite.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/app.css">  
</head> 
<style>
    * {
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background-color: #FFF8E7;
    margin: 0;
    padding: 30px 15px;
    color: #333333;
}

/* MAIN CARD */

section {
    width: 100%;
    max-width: 800px;
    margin: 30px auto;
    padding: 35px;
    background-color: #FFFFFF;
    border-radius: 18px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
}

/* HEADER */

.header-icon {
    text-align: center;
    font-size: 50px;
    margin-bottom: 5px;
}

h1 {
    text-align: center;
    color: #2E7D32;
    font-size: 34px;
    margin: 5px 0;
}

.highlight {
    color: #FF8F00;
}

h2 {
    text-align: center;
    color: #333333;
    font-size: 27px;
    margin: 10px 0;
}

.subtitle {
    text-align: center;
    color: #2E7D32;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 8px;
}

.description {
    text-align: center;
    color: #666666;
    font-size: 15px;
    line-height: 1.6;
    max-width: 650px;
    margin: 0 auto 30px;
}

/* FORM SECTIONS */

.form-section {
    background-color: #F8FFF8;
    border: 1px solid #D7EBD8;
    border-radius: 12px;
    padding: 22px;
    margin-bottom: 22px;
}

.form-section h3 {
    color: #2E7D32;
    margin-top: 0;
    margin-bottom: 18px;
    font-size: 20px;
    border-bottom: 1px solid #D7EBD8;
    padding-bottom: 10px;
}

/* LABEL */

label {
    display: block;
    text-align: left;
    margin-top: 15px;
    margin-bottom: 7px;
    font-weight: bold;
    color: #444444;
}

/* INPUT, SELECT AND TEXTAREA */

input,
select,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #81C784;
    border-radius: 7px;
    font-size: 15px;
    font-family: Arial, Helvetica, sans-serif;
    outline: none;
    background-color: #FFFFFF;
}

input:focus,
select:focus,
textarea:focus {
    border-color: #2E7D32;
    box-shadow: 0 0 5px rgba(46, 125, 50, 0.25);
}

textarea {
    resize: vertical;
}

/* DONATE BUTTON */

button {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    background-color: #2E7D32;
    color: #FFFFFF;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background-color: #1B5E20;
    transform: translateY(-2px);
}

/* MOBILE RESPONSIVE */

@media (max-width: 600px) {

    section {
        padding: 22px 15px;
        margin: 10px auto;
    }

    h1 {
        font-size: 27px;
    }

    h2 {
        font-size: 23px;
    }

    .form-section {
        padding: 17px;
    }

    .header-icon {
        font-size: 42px;
    }

    .subtitle {
        font-size: 17px;
    }

    .description {
        font-size: 14px;
    }
}
</style>
<body>
    <nav class="app-bar" aria-label="Account">
        <a class="brand" href="index.html">SHARE BITE</a>
        <a href="dashboard.html">Dashboard</a>
        <button type="button" id="logoutBtn">Logout</button>
    </nav>
    <section> 
        <h2>Food <span class="highlight">Donor</span></h2> 
        <p class="subtitle"> 
            Donate surplus food and help reduce food waste. 
        </p> 
        <p class="description"> 
            Your extra food can make a difference. Provide the details 
            below and help us connect your surplus food with someone in need. 
        </p> 
 
        <form id="donorForm">  
           <div class="form-section"> 
                <h3>👤 Donor Details</h3> 
                <label for="donorName">Donor Name:</label> 
                <input 
                    type="text" 
                    id="donorName" 
                    name="donorName" 
                    placeholder="Enter your name" 
                    required 
                > 
                <label for="contact">Contact Number:</label> 
                <input 
                    type="tel" 
                    id="contact" 
                    name="contact" 
                    placeholder="Enter your 10-digit phone number" 
                    maxlength="10" 
                    pattern="[0-9]{10}" 
                    required 
                > 
            </div> 
            <div class="form-section"> 
                <h3>🍱 Food Details</h3> 
                <label for="foodName">Food Name:</label> 
                <input 
                    type="text" 
                    id="foodName" 
                    name="foodName" 
                    placeholder="Example: Rice, Dal, Chapati" 
                    required 
                > 
                <label for="plates"> 
                    Number Of Food Plates: 
                </label>
                <input 
                    type="number" 
                    id="plates" 
                    name="plates" 
                    placeholder="Enter number of plates" 
                    min="1" 
                    required 
                > 
                <label for="foodType">Food Type:</label> 
                <select id="foodType" name="foodType" required> 
                    <option value=""> 
                        Select Food Type 
                    </option> 
                    <option value="vegetarian"> 
                        Vegetarian 
                    </option> 
                    <option value="non-vegetarian"> 
                        Non-Vegetarian 
                    </option> 
                    <option value="packaged_foods"> 
                        Packaged Foods 
                    </option> 
                    <option value="fruits_vegetables"> 
                        Fruits and Vegetables 
                    </option> 
                </select> 
            </div>

            <div class="form-section"> 
                <h3>📍 Pickup Details</h3> 
                <label for="pickupAddress"> 
                    Pickup Address: 
                </label> 
                <textarea 
                    id="pickupAddress" 
                    name="pickupAddress" 
                    rows="3" 
                    placeholder="Enter your pickup location" 
                    required 
                ></textarea> 
                <label for="confirmAddress"> 
                    Confirm Pickup Address: 
                </label> 
                <textarea 
                    id="confirmAddress" 
                    name="confirmAddress" 
                    rows="3" 
                    placeholder="Enter your pickup location again" 
                    required 
                ></textarea> 
                <label for="pickupDate"> 
                    Pickup Date: 
                </label> 
                <input 
                    type="date" 
                    id="pickupDate" 
                    name="pickupDate" 
                    required 
                > 
                <label for="pickupTime"> 
                    Pickup Time: 
                </label> 
                <input 
                    type="time" 
                    id="pickupTime" 
                    name="pickupTime" 
                    required 
                > 
            </div> 
 
            <div class="form-section"> 
                <h3>📝 Additional Information</h3> 
                <label for="additionalInfo"> 
                    Additional Information: 
                </label> 
                <textarea 
                    id="additionalInfo" 
                    name="additionalInfo" 
                    rows="4" 
                    placeholder="Enter any special instructions if needed" 
                ></textarea>  
            </div>  
            <p id="msg" class="form-msg" role="status" aria-live="polite"></p>
            <button type="submit"> 
                🍱 DONATE FOOD 
            </button> 
        </form> 
    </section> 
    <script src="js/api.js"></script>
    <script src="js/food-donor.js"></script>
</body> 
</html>
