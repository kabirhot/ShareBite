<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Food - ShareBite</title>
    <meta name="description" content="Request surplus food for your organization or NGO.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/app.css">
</head>
<style>
    * {
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background-color: #FFF8E7;
    margin: 0;
    padding: 30px 15px;
    color: #333333;
}

/* MAIN CARD */

section {
    width: 100%;
    max-width: 800px;
    margin: 30px auto;
    padding: 35px;
    background-color: #FFFFFF;
    border-radius: 18px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
}

/* HEADER */

.header-icon {
    text-align: center;
    font-size: 50px;
    margin-bottom: 5px;
}

h1 {
    text-align: center;
    color: #2E7D32;
    font-size: 34px;
    margin: 5px 0;
}

.highlight {
    color: #FF8F00;
}

h2 {
    text-align: center;
    color: #333333;
    font-size: 27px;
    margin: 10px 0;
}

.subtitle {
    text-align: center;
    color: #2E7D32;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 8px;
}

.description {
    text-align: center;
    color: #666666;
    font-size: 15px;
    line-height: 1.6;
    max-width: 650px;
    margin: 0 auto 30px;
}

/* FORM SECTIONS */

.form-section {
    background-color: #F8FFF8;
    border: 1px solid #D7EBD8;
    border-radius: 12px;
    padding: 22px;
    margin-bottom: 22px;
}

.form-section h3 {
    color: #2E7D32;
    margin-top: 0;
    margin-bottom: 18px;
    font-size: 20px;
    border-bottom: 1px solid #D7EBD8;
    padding-bottom: 10px;
}

/* LABEL */

label {
    display: block;
    text-align: left;
    margin-top: 15px;
    margin-bottom: 7px;
    font-weight: bold;
    color: #444444;
}

/* INPUT, SELECT AND TEXTAREA */

input,
select,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #81C784;
    border-radius: 7px;
    font-size: 15px;
    font-family: Arial, Helvetica, sans-serif;
    outline: none;
    background-color: #FFFFFF;
}

input:focus,
select:focus,
textarea:focus {
    border-color: #2E7D32;
    box-shadow: 0 0 5px rgba(46, 125, 50, 0.25);
}

textarea {
    resize: vertical;
}

/* DONATE BUTTON */

button {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    background-color: #2E7D32;
    color: #FFFFFF;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background-color: #1B5E20;
    transform: translateY(-2px);
}

/* MOBILE RESPONSIVE */

@media (max-width: 600px) {

    section {
        padding: 22px 15px;
        margin: 10px auto;
    }

    h1 {
        font-size: 27px;
    }

    h2 {
        font-size: 23px;
    }

    .form-section {
        padding: 17px;
    }

    .header-icon {
        font-size: 42px;
    }

    .subtitle {
        font-size: 17px;
    }

    .description {
        font-size: 14px;
    }
}
</style>
<body>
    <nav class="app-bar" aria-label="Account">
        <a class="brand" href="index.html">SHARE BITE</a>
        <a href="dashboard.html">Dashboard</a>
        <button type="button" id="logoutBtn">Logout</button>
    </nav>
    <section>
        <h2>Food <span class="highlight">Receiver</span></h2>
        <p class="subtitle">
            Request surplus food and help serve those in need.
        </p>
        <p class="description">
            Provide the required food details and location so that
            available surplus food can reach the right people.
        </p>

        <form id="receiverForm">
        <div class="form-section">
            <h3>👤 Receiver Details</h3>
            <label for="receiverName">
                Receiver's Name:
            </label>
            <input type="text"
                   id="receiverName"
                   name="receiverName"
                   placeholder="Enter receiver's name"
                   required>
            <label for="organization">
                Organization / NGO's Name:
            </label>
            <input type="text"
                   id="organization"
                   name="organization"
                   placeholder="Enter organization / NGO's name"
                   required>
            <label for="email">
                Email ID:
            </label>
            <input type="email"
                   id="email"
                   name="email"
                   placeholder="Enter email ID"
                   required>
            <label for="contact">
                Contact Number:
            </label>
            <input type="tel"
                   id="contact"
                   name="contact"
                   placeholder="Enter 10-digit contact number"
                   maxlength="10"
                   pattern="[0-9]{10}"
                   required>
        </div>

        <div class="form-section">
            <h3>🍱 Food Requirements</h3>
            <label for="foodType">
                Food Required Type:
            </label>
            <select id="foodType"
                    name="foodType"
                    required>
                <option value="">
                    Select Food Type
                </option>
                <option value="vegetarian">
                    Vegetarian
                </option>
                <option value="non-vegetarian">
                    Non-Vegetarian
                </option>
                <option value="packaged_foods">
                    Packaged Foods
                </option>
                <option value="fruits_vegetables">
                    Fruits and Vegetables
                </option>
            </select>
            <label for="quantity">
                Required Quantity:
            </label>
            <input type="text"
                   id="quantity"
                   name="quantity"
                   placeholder="Enter quantity required"
                   required>
            <label for="amount">
                Amount (₹):
            </label>
            <select id="amount"
                    name="amount"
                    required>
                <option value="">
                    Select Amount
                </option>
                <option value="0-500">
                    ₹0 - ₹500
                </option>
                <option value="501-1000">
                    ₹501 - ₹1,000
                </option>
                <option value="1001-5000">
                    ₹1,001 - ₹5,000
                </option>
                <option value="5001-10000">
                    ₹5,001 - ₹10,000
                </option>
                <option value="10001+">
                    ₹10,001+
                </option>
            </select>
        </div>

        <div class="form-section">
            <h3>📍 Delivery Details</h3>
            <label for="deliveryLocation">
                Delivery Location:
            </label>
            <textarea id="deliveryLocation"
                      name="deliveryLocation"
                      rows="3"
                      placeholder="Enter your complete delivery location"
                      required></textarea>
            <label for="requiredDate">
                Required Date:
            </label>
            <input type="date"
                   id="requiredDate"
                   name="requiredDate"
                   required>
            <label for="deliveryTime">
                Delivery Time:
            </label>
            <input type="time"
                   id="deliveryTime"
                   name="deliveryTime"
                   required>
        </div>

        <div class="form-section">
            <h3>📝 Additional Requirements</h3>
            <label for="additionalRequirements">
                Additional Requirements:
            </label>
            <textarea id="additionalRequirements"
                      name="additionalRequirements"
                      rows="4"
                      placeholder="Enter any specific requirements if needed"></textarea>
        </div>

        <p id="msg" class="form-msg" role="status" aria-live="polite"></p>
        <button type="submit">
            🍱 RECEIVE FOOD
        </button>
        </form>
    </section>
    <script src="js/api.js"></script>
    <script src="js/food-receiver.js"></script>
</body>
</html>
